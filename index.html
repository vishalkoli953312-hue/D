        }

        body {
            background-color: #0f172a;
            color: #ffffff;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
