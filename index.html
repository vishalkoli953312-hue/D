<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऐप डाउनलोड करें - App Download Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .download-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        .app-name {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .app-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background-color: #28a745;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .download-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .info-text {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="app-icon">A</div>

        <h1 class="Squad File">मेरा एंड्रॉइड ऐप</h1>

        <p class="app-desc">नीचे दिए गए बटन पर क्लिक करके लेटेस्ट APK फ़ाइल आसानी से डाउनलोड करें।</p>

        <a href="Squad Fire.apk" class="download-btn" download>Download APK</a>

        <p class="info-text">सुरक्षित और 100% कार्यशील</p>
    </div>

</body>
</html>
